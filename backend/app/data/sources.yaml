  # 内网 FinancialJuice：只读 SELECT news 契约列，不写回
  - id: financialjuice
    name: FinancialJuice
    region: intl
    kind: news
    access: fj_readonly
    enabled: true
    url: fj://news
    poll_interval_minutes: 5
    lang: zh
    note: 时间线直读内网库，不写入本地 articles

  - id: forex-factory-calendar
    name: 财经日历
    region: intl
    kind: calendar
    access: proxy
    enabled: true
    url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
    poll_interval_minutes: 60
    lang: en
    note: 采集写入本地 events，大事件与简报读库

  - id: weibo-hot
    name: 微博热搜
    region: cn
    kind: hotspot
    access: direct
    enabled: true
    url: https://weibo.com/ajax/side/hotSearch
    poll_interval_minutes: 20
    lang: zh
    note: 采集写入本地 hot_items，简报读最近一批

  # 榜单写入独立 PostgreSQL 库的 chart_items，同一业务日重复采集覆盖当天快照
  - id: github-trending
    name: GitHub 热榜
    region: intl
    kind: chart
    access: proxy
    enabled: true
    url: https://github.com/trending?since=daily
    poll_interval_minutes: 180
    lang: en
    note: 每日热榜页面解析，经本机代理

  - id: appstore-top
    name: App Store 热门榜
    region: intl
    kind: chart
    access: direct
    enabled: true
    url: https://itunes.apple.com/{region}/rss/{chart}/limit=50/json
    poll_interval_minutes: 180
    lang: en
    note: 美英德法中日韩台港 × 免费/付费/畅销，各前 50
